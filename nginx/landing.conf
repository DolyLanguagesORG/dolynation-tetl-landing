# Configuracion de nginx dentro del contenedor de la landing.
#
# La landing es un sitio estatico de una sola pagina (Astro, `output:
# "static"`). Este nginx sirve los archivos de `dist/` y no hace nada mas:
# no hay PHP, ni API, ni proxy a otro servicio.
#
# Lo que hay que cuidar:
#
#   - Los assets llevan hash en el nombre (`/_astro/hero.abc123.css`): se
#     pueden cachear para siempre. El HTML no: si no, el navegador se
#     queda con una pagina vieja.
#   - `index.html` se sirve para cualquier ruta desconocida, para que una
#     URL profunda no devuelva un 404.
#   - La compresion (gzip) reduce bastante el peso de Three.js y GSAP.

map "$uri:$arg_v" $sprites_cache_control {
    "~^/sprites/.+\.webp:.+$" "public, max-age=31536000, immutable";
    default                    "no-cache, must-revalidate";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad basicas. Las de la app las pone el proxy del
    # servidor; aqui se repite lo que aplica a un sitio estatico.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Sin esto, un `add_header` dentro de un `location` **reemplaza** a los
    # del `server` en vez de añadirse: las cabeceras de seguridad se
    # perdian en cada bloque que declaraba su propia Cache-Control.
    # `merge` las une (nginx >= 1.29.3).
    add_header_inherit merge;

    # No se anuncia la version de nginx.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm font/woff2;

    # --- Assets con hash: cache de un ano -------------------------------
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # --- Sprites de Doly: inmutables con ?v=<hash>, revalidacion sin version ---
    location ^~ /sprites/ {
        expires off;
        add_header Cache-Control $sprites_cache_control always;
        access_log off;
        try_files $uri =404;
    }

    # --- Imagenes y fuentes ---------------------------------------------
    location ~* \.(?:png|jpg|jpeg|gif|webp|avif|svg|ico|woff2?|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
        try_files $uri =404;
    }

    # --- El HTML: nunca se cachea ----------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Configuracion runtime por ambiente (nunca se cachea) ------------
    location = /runtime-config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # --- Todo lo demas: la pagina ----------------------------------------
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
